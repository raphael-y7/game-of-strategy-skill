router_entry:
  name: game-of-strategy-skill-router
  description: 《策略博弈（第4版）》博弈分析来源路由入口：用行动时序/利益冲突/次数/信息/规则/协调六问给股票投资情境分类，路由到博弈树逆推、纳什均衡、合作临界值、信号可信度、策略性行动、赢家诅咒、策略拥挤等13张能力卡。当用户的问题不明确属于哪个具体博弈分析任务时由此入口分类分派。
entry:
  name: game-of-strategy-skill
  description: 以《策略博弈（第4版）》方法论辅助股票投资分析：把市场局面翻译为博弈结构（参与者/时序/信息/支付），选择正确解概念（逆推/纳什均衡/ESS）得出可核对的行为预测，覆盖事件博弈树、合作瓦解临界、信号可信度、赢家诅咒、策略拥挤五类核心任务。适用于用户要求用博弈论分析个股事件、行业格局、政策博弈、打新与并购谈判等场景。
  core_principles:
  - 先判结构再求解：时序、冲突度、重复性、信息结构、规则可否操纵、协调维度六问分类（第2章）
  - 序贯博弈逆推：向前看、向后推理，从终点结剪枝（第3章）
  - 同时行动找纳什均衡：互为最优反应，弱占优剔除须复查（第4-5章）
  - 行动胜于语言：信号须差异成本，威胁须互相伤害且可置信（第8-9章）
  - 合作靠未来：重复博弈用有效收益率对照临界值判断瓦解风险（第10章）
  - 中标即坏消息：共同价值拍卖向下调整防赢家的诅咒（第16章）
  out_of_scope:
  - 不预测股价涨跌方向，只输出博弈结构与行为预测
  - 不处理与多人策略互动无关的纯技术指标问题
  - 投票制度与生物进化数学细节不做计算（第12/15章仅取思想）
  stop_conditions:
  - 输入缺失参与人/支付/时序等关键要素时先询问，不代填
  - 支付数值无法估计且用户不提供时，输出定性方向而非伪造数值
  - 局面不构成策略互动（无交叉效应）时明确退出并说明
promotion_budget: 8
